<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

<title>うどんマップ｜香川のうどん屋巡りを地図に記録する無料ツール</title>
<meta name="description" content="訪れた香川県のうどん屋を地図にピンで記録できる無料ツール。高松市・丸亀市など市町ごとの訪問状況もひと目で確認できます。登録不要・インストール不要、記録は端末内にだけ保存されます。">
<link rel="canonical" href="https://udon-map.github.io/">
<meta name="theme-color" content="#12161b">

<!-- SNSでリンクを貼ったときの見え方 -->
<meta property="og:type" content="website">
<meta property="og:title" content="うどんマップ｜香川のうどん屋巡りを地図に記録">
<meta property="og:description" content="訪れた香川県のうどん屋を地図にピンで記録。市町ごとの訪問状況もひと目でわかります。登録不要・無料。">
<meta property="og:url" content="https://udon-map.github.io/">
<meta property="og:image" content="https://udon-map.github.io/ogp.png">
<meta property="og:site_name" content="うどんマップ">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "うどんマップ",
  "url": "https://udon-map.github.io/",
  "description": "訪れた香川県のうどん屋を地図に記録できる無料ツール。市町ごとの訪問状況を確認できます。",
  "applicationCategory": "TravelApplication",
  "operatingSystem": "Web",
  "inLanguage": "ja",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" }
}
</script>

<!-- ▼ MapLibre GL JS。地図の描画をすべてこれ1つで行う（Leafletは使わない） -->
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

<style>
/* =========================================================
   配色：地図は明るく、UIは浮いた暗色パネル。差し色は琥珀。
   ========================================================= */
:root{
  --ink:      #12161b;
  --ink-soft: rgba(18,22,27,.82);
  --pop-bg:   rgba(18,22,27,.94);
  --line:     rgba(255,255,255,.10);
  --text:     #f1efec;
  --muted:    #99a1a9;
  --amber:    #e8a33d;
  --amber-dk: #b8801f;
  --danger:   #e2685f;
  --radius:   14px;
  --shadow:   0 10px 34px rgba(10,14,20,.30);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }

body{
  font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Segoe UI", sans-serif;
  font-feature-settings: "palt" 1;
  color: var(--text);
  background: #e7e7e4;
}

#map{ position:absolute; inset:0; z-index:0; }
#map.adding canvas{ cursor:crosshair !important; }

/* ---------- 浮かぶパネル共通 ---------- */
.panel{
  background: var(--ink-soft);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- 上部バー ---------- */
.topbar{
  position:absolute; z-index:1200;
  top:12px; left:12px; right:12px;
  display:flex; align-items:center; gap:14px;
  padding:10px 12px 10px 16px;
}
.brand{ display:flex; flex-direction:column; line-height:1.15; flex-shrink:0; }
.brand b{ font-size:15px; font-weight:700; letter-spacing:.16em; }
.brand b i{ font-style:normal; color:var(--amber); }
.brand small{ font-size:10px; letter-spacing:.22em; color:var(--muted); }

.area-wrap{ position:relative; flex-shrink:0; }
.area-wrap::after{
  content:''; position:absolute; right:12px; top:50%;
  width:6px; height:6px; margin-top:-4px;
  border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted);
  transform:rotate(45deg); pointer-events:none;
}
select#area{
  appearance:none; -webkit-appearance:none;
  font-family:inherit; font-size:13px; font-weight:500;
  color:var(--text); background:rgba(255,255,255,.07);
  border:1px solid var(--line); border-radius:999px;
  padding:8px 32px 8px 14px; cursor:pointer; max-width:200px;
}
select#area:hover{ background:rgba(255,255,255,.12); }
select#area:focus-visible{ outline:2px solid var(--amber); outline-offset:1px; }
select#area option{ background:#1b2026; color:var(--text); }

.stats{ display:flex; gap:20px; margin-left:auto; padding-right:4px; }
.stat{ text-align:right; line-height:1.1; }
.stat b{ display:block; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
.stat span{ font-size:10px; letter-spacing:.1em; color:var(--muted); }
.stat.accent b{ color:var(--amber); }

/* ---------- 下部の操作 ---------- */
.dock{
  position:absolute; z-index:1200;
  left:12px; bottom:22px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}

button{
  font-family:inherit; font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; gap:7px;
  padding:10px 17px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line);
  background:var(--ink-soft);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  color:var(--text); box-shadow:var(--shadow);
  transition:background .15s, transform .1s;
}
button:hover{ background:rgba(38,44,52,.9); }
button:active{ transform:translateY(1px); }
button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
button:disabled{ opacity:.55; cursor:default; }

button.primary{ background:var(--amber); border-color:var(--amber); color:#1a1206; font-weight:600; }
button.primary:hover{ background:#f0b055; }
button.primary.active{ background:#f0b055; }
button.active{ background:var(--amber); border-color:var(--amber); color:#1a1206; font-weight:600; }

.dot{ width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.85; }

.hint{
  font-size:11px; color:#5c6068;
  background:rgba(255,255,255,.78);
  padding:6px 12px; border-radius:999px;
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}

/* ---------- メニュー（…） ---------- */
.menu-wrap{ position:relative; flex-shrink:0; }
#btn-menu{ padding:10px 13px; }
.menu{
  position:absolute; right:0; top:calc(100% + 8px);
  min-width:190px; padding:6px; display:none; z-index:1300;
}
.menu.open{ display:block; }
.menu button{
  display:flex; width:100%; justify-content:flex-start;
  background:none; border:none; box-shadow:none;
  border-radius:9px; padding:9px 12px; font-size:13px;
}
.menu button:hover{ background:rgba(255,255,255,.09); }
.menu hr{ border:none; border-top:1px solid var(--line); margin:5px 8px; }

/* ---------- ピン（うどん丼） ----------
   外側の .pin-wrap には transition を絶対に付けないこと。
   MapLibre はズームのたびにこの要素の transform を書き換えて
   位置を合わせるので、transition があると追従が遅れて見える。
   拡大などの演出は内側の .pin に掛ける。 */
.pin-wrap{
  width:42px; height:54px;
  cursor:pointer;
  line-height:0;
}
.pin{
  width:42px; height:54px;
  transition:transform .12s;
  transform-origin:50% 100%;
  filter:drop-shadow(0 3px 5px rgba(10,14,20,.35));
}
.pin-wrap:hover .pin{ transform:scale(1.12); }
.pin-wrap.ghost{ opacity:.55; }

/* 市町名のラベル */
.area-name{
  white-space:nowrap;
  font-size:11.5px; font-weight:700; letter-spacing:.08em;
  color:#4a3f30;
  text-shadow:
     0 0 3px rgba(255,255,255,.95), 0 0 3px rgba(255,255,255,.95),
     0 0 7px rgba(255,255,255,.85), 0 1px 2px rgba(255,255,255,.95);
  pointer-events:none;
}

/* 現在地 */
.me{
  width:16px; height:16px; border-radius:50%;
  background:#2f7de1; border:3px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.2), 0 0 14px rgba(47,125,225,.7);
}

/* ---------- ポップアップ（MapLibreの既定を上書き） ---------- */
.u-popup .maplibregl-popup-content{
  background:var(--pop-bg);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 12px 40px rgba(10,14,20,.45);
  padding:14px 16px;
}
/* 吹き出しの三角。向きごとに色を指定する必要がある */
.u-popup.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
.u-popup.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
.u-popup.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{ border-top-color:var(--pop-bg); }
.u-popup.maplibregl-popup-anchor-top .maplibregl-popup-tip,
.u-popup.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
.u-popup.maplibregl-popup-anchor-top-right .maplibregl-popup-tip{ border-bottom-color:var(--pop-bg); }
.u-popup.maplibregl-popup-anchor-left .maplibregl-popup-tip{ border-right-color:var(--pop-bg); }
.u-popup.maplibregl-popup-anchor-right .maplibregl-popup-tip{ border-left-color:var(--pop-bg); }

.popup-name{ font-size:15px; font-weight:600; letter-spacing:.02em; margin-bottom:3px; }
.popup-count{ font-size:12px; color:var(--muted); margin-bottom:11px; line-height:1.6; }
.popup-count b{ color:var(--amber); font-size:15px; font-variant-numeric:tabular-nums; }

.popup-input{
  width:100%; font-family:inherit; font-size:14px; color:var(--text);
  padding:9px 11px; margin-bottom:9px;
  background:rgba(255,255,255,.07);
  border:1px solid var(--line); border-radius:9px;
}
.popup-input::placeholder{ color:#6d747c; }
.popup-input:focus{ outline:none; border-color:var(--amber); background:rgba(255,255,255,.11); }

.popup-city{
  display:flex; align-items:center; gap:7px;
  font-size:11px; letter-spacing:.08em; color:var(--muted); margin-bottom:11px;
}
.popup-city select{
  appearance:none; -webkit-appearance:none;
  font-family:inherit; font-size:12px; color:var(--text);
  background:rgba(255,255,255,.07);
  border:1px solid var(--line); border-radius:7px;
  padding:5px 10px; cursor:pointer;
}
.popup-city select option{ background:#1b2026; }

.popup-actions{ display:flex; gap:7px; align-items:center; }
.popup-actions button{ font-size:12px; padding:8px 14px; box-shadow:none; }
.link-danger{
  background:none !important; border:none !important; box-shadow:none !important;
  color:var(--danger); font-size:12px; padding:8px 6px;
}
.link-danger:hover{ color:#f08d84; }
.popup-note{ font-size:10.5px; color:#6d747c; margin-top:10px; line-height:1.6; }

/* ---------- 一覧パネル ---------- */
.sheet{
  position:absolute; z-index:1250;
  left:12px; top:78px; bottom:78px; width:352px;
  display:none; flex-direction:column; overflow:hidden;
}
.sheet.open{ display:flex; }
.sheet-head{ display:flex; gap:8px; padding:12px; border-bottom:1px solid var(--line); }
.sheet-search{
  flex:1; font-family:inherit; font-size:13px; color:var(--text);
  padding:9px 12px; border-radius:9px;
  background:rgba(255,255,255,.07); border:1px solid var(--line);
}
.sheet-search::placeholder{ color:#6d747c; }
.sheet-search:focus{ outline:none; border-color:var(--amber); }
#sheet-close{ padding:9px 13px; box-shadow:none; background:rgba(255,255,255,.06); }

.sheet-meta{
  padding:9px 14px; font-size:11px; letter-spacing:.06em; color:var(--muted);
  border-bottom:1px solid var(--line);
}
.sheet-meta b{ color:var(--amber); font-variant-numeric:tabular-nums; }

.sheet-list{ flex:1; overflow-y:auto; overscroll-behavior:contain; }
.sheet-list::-webkit-scrollbar{ width:8px; }
.sheet-list::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:4px; }

.row{
  display:flex; align-items:center; gap:11px;
  padding:11px 14px; cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.row:hover{ background:rgba(255,255,255,.06); }
.row-body{ flex:1; min-width:0; }
.row-name{ font-size:13px; font-weight:500; margin-bottom:2px; }
.row-addr{ font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-ctrl{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.row-badge{
  min-width:30px; height:26px; padding:0 8px;
  display:flex; align-items:center; justify-content:center;
  border-radius:999px; font-size:12px; font-weight:700;
  font-variant-numeric:tabular-nums;
  background:var(--amber); color:#1a1206;
}
.row.new .row-badge{
  background:none; border:1px dashed rgba(255,255,255,.25);
  color:var(--muted); font-weight:400; font-size:15px;
}
.row.new .row-name{ color:#c9ccd0; }

/* 行の増減ボタン。指でも押しやすいよう28pxを確保する */
.row-btn{
  width:28px; height:28px; padding:0;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; font-size:16px; font-weight:600; line-height:1;
  background:rgba(255,255,255,.08); border:1px solid var(--line);
  box-shadow:none; color:var(--text);
}
.row-btn:hover{ background:rgba(255,255,255,.2); }
.row-btn.minus{ color:#f0a29b; }
.row-btn.plus{ color:var(--amber); }

/* エリア選択（一覧パネル内） */
.sheet-meta{ display:flex; align-items:center; gap:10px; }
.sheet-area-wrap{ position:relative; }
.sheet-area-wrap::after{
  content:''; position:absolute; right:9px; top:50%;
  width:5px; height:5px; margin-top:-3px;
  border-right:1.4px solid var(--muted); border-bottom:1.4px solid var(--muted);
  transform:rotate(45deg); pointer-events:none;
}
#sheet-area{
  appearance:none; -webkit-appearance:none;
  font-family:inherit; font-size:12px; font-weight:500; color:var(--text);
  background:rgba(255,255,255,.08); border:1px solid var(--line);
  border-radius:999px; padding:5px 24px 5px 11px; cursor:pointer;
}
#sheet-area:hover{ background:rgba(255,255,255,.15); }
#sheet-area option{ background:#1b2026; color:var(--text); }
.sheet-none{ padding:26px 16px; text-align:center; font-size:12px; color:var(--muted); }

/* ---------- 取り消しトースト ---------- */
.toast{
  position:absolute; z-index:1400;
  left:50%; bottom:22px; transform:translateX(-50%);
  display:flex; align-items:center; gap:14px;
  padding:11px 12px 11px 18px;
  opacity:0; pointer-events:none;
  transition:opacity .18s, transform .18s;
}
.toast.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(-4px); }
.toast-text{ font-size:13px; white-space:nowrap; }
.toast-text b{ color:var(--amber); font-weight:600; }
.toast button{ font-size:12.5px; padding:7px 14px; background:rgba(255,255,255,.09); box-shadow:none; }
.toast button:hover{ background:rgba(255,255,255,.16); }

/* ---------- 選択中のエリア名（余白に縦書きで大きく出す） ---------- */
.area-title{
  position:absolute; z-index:1150;
  right:16px; top:50%;
  writing-mode:vertical-rl; text-orientation:upright;
  display:none; align-items:flex-start; gap:10px;
  pointer-events:none;                 /* 地図の操作を邪魔しない */
  opacity:0; transform:translateY(-50%) translateX(14px);
  transition:opacity .45s ease, transform .45s ease;
}
.area-title.show{ display:flex; opacity:1; transform:translateY(-50%) translateX(0); }

.at-ja{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:46px; font-weight:600; letter-spacing:.16em;
  color:rgba(240,180,80,.95);
  text-shadow:0 2px 22px rgba(8,12,18,.7), 0 0 3px rgba(8,12,18,.6);
}
.at-en{
  writing-mode:vertical-rl; text-orientation:sideways;
  font-size:10.5px; font-weight:700; letter-spacing:.44em;
  color:rgba(255,255,255,.5);
  margin-top:4px;
  text-shadow:0 1px 10px rgba(8,12,18,.8);
}

.foot-link{
  position:absolute; z-index:1200;
  left:14px; bottom:2px;
  font-size:10px; color:#6a7078; text-decoration:none; letter-spacing:.04em;
}
.foot-link:hover{ color:var(--amber); }

/* ---------- MapLibreの部品を馴染ませる ---------- */
.maplibregl-ctrl-group{
  background:var(--ink-soft) !important;
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border:1px solid var(--line) !important;
  border-radius:11px !important;
  box-shadow:var(--shadow) !important;
  overflow:hidden;
}
.maplibregl-ctrl-group button{
  width:34px !important; height:34px !important;
  background:none !important; border:none !important;
  border-radius:0 !important; box-shadow:none !important;
  padding:0 !important;
}
.maplibregl-ctrl-group button+button{ border-top:1px solid var(--line) !important; }
.maplibregl-ctrl-group button:hover{ background:rgba(255,255,255,.09) !important; }
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{ filter:invert(1) brightness(1.7); }

.maplibregl-ctrl-attrib{
  background:rgba(255,255,255,.82) !important;
  font-size:10px !important; border-radius:7px 0 0 0;
}
.maplibregl-ctrl-attrib a{ color:#5c6068 !important; }

.fallback{
  position:absolute; inset:0; z-index:2000;
  display:none; align-items:center; justify-content:center;
  background:var(--ink); text-align:center; padding:32px; line-height:1.9;
}
.fallback.show{ display:flex; }

@media (max-width:640px){
  .topbar{ flex-wrap:wrap; gap:10px; padding:10px 12px; }
  .brand{ order:1; }
  .menu-wrap{ order:2; margin-left:auto; }
  .area-wrap{ order:3; }
  .stats{ order:4; margin-left:auto; gap:16px; }
  .stat b{ font-size:16px; }
  .dock{ bottom:16px; left:12px; right:12px; }
  .hint{ display:none; }
  .sheet{ left:10px; right:10px; width:auto; top:auto; bottom:74px; height:58vh; }
  .toast{ left:12px; right:12px; transform:none; }
  .toast.show{ transform:translateY(-4px); }
  .toast-text{ white-space:normal; flex:1; }
  .area-name{ font-size:10px; letter-spacing:.04em; }
  .area-title{ right:10px; gap:7px; }
  .at-ja{ font-size:31px; letter-spacing:.12em; }
  .at-en{ font-size:9px; letter-spacing:.34em; }
}
</style>
</head>
<body>

<div class="topbar panel">
  <div class="brand">
    <b>UDON<i>·</i>MAP</b>
    <small>KAGAWA</small>
  </div>

  <div class="area-wrap">
    <select id="area"><option value="all">香川県全体</option></select>
  </div>

  <div class="stats">
    <div class="stat"><b id="stat-shops">0</b><span>軒</span></div>
    <div class="stat"><b id="stat-visited">0</b><span>訪問済</span></div>
    <div class="stat accent"><b id="stat-total">0</b><span>のべ</span></div>
  </div>

  <div class="menu-wrap">
    <button id="btn-menu" aria-label="メニュー">···</button>
    <div class="menu panel" id="menu">
      <button id="btn-style">地図のスタイルを変える</button>
      <button id="btn-north">向きを初期状態に戻す</button>
      <hr>
      <button id="btn-export">データを書き出す</button>
      <button id="btn-import">データを読み込む</button>
    </div>
  </div>
</div>

<div id="map"></div>

<div class="sheet panel" id="sheet">
  <div class="sheet-head">
    <input type="text" id="sheet-q" class="sheet-search" placeholder="店名・住所で検索" autocomplete="off">
    <button id="sheet-close" aria-label="閉じる">✕</button>
  </div>
  <div class="sheet-meta">
    <div class="sheet-area-wrap">
      <select id="sheet-area"></select>
    </div>
    <span id="sheet-meta"></span>
  </div>
  <div class="sheet-list" id="sheet-list"></div>
</div>

<div class="dock">
  <button id="btn-list" class="primary">一覧から選ぶ</button>
  <button id="btn-here"><span class="dot"></span>現在地から追加</button>
  <button id="btn-add">地図から追加</button>
  <span class="hint" id="hint">地図を右クリックしても登録できます</span>
</div>

<input type="file" id="file-input" accept="application/json" hidden>

<div class="toast panel" id="toast">
  <div class="toast-text"><b id="toast-name"></b> <span id="toast-suffix">を登録しました</span></div>
  <button id="toast-undo">取り消す</button>
</div>

<div class="area-title" id="area-title" aria-hidden="true">
  <span class="at-ja" id="at-ja"></span>
  <span class="at-en" id="at-en"></span>
</div>

<a class="foot-link" href="privacy.html">プライバシーポリシー</a>

<div class="fallback panel" id="fallback">
  <div>
    <b>地図を表示できませんでした</b><br>
    <span style="color:var(--muted);font-size:13px">
      このページは WebGL という描画機能を使います。<br>
      お使いのブラウザで有効になっているかご確認ください。
    </span>
  </div>
</div>

<script>
/* =========================================================
   ① データの置き場所
   ---------------------------------------------------------
   shops … 自分の訪問記録（端末内に保存）
   catalog … shops.json から読む、うどん屋の一覧
   boundaries … kagawa.geojson から読む、市町の形
   ========================================================= */

const STORAGE_KEY = 'udonmap_shops_v1';   // 保存形式は従来どおり。過去の記録をそのまま引き継ぐ
const STYLE_KEY   = 'udonmap_style_v1';

let shops = [];
let catalog = [];
let boundaries = [];

let markers = {};        // 訪問記録のピン（店のid → Marker）
let labelMarkers = [];   // 市町名のラベル
let meMarker = null;     // 現在地
let ghostMarker = null;  // 登録しようとしている場所の仮ピン
let addingMode = false;
let styleReady = false;


/* =========================================================
   ①-2 香川県の市町（8市9町）
   ========================================================= */

const KAGAWA = [
  { name: '高松市',     lat: 34.3428, lng: 134.0466, en: 'TAKAMATSU' },
  { name: '丸亀市',     lat: 34.2896, lng: 133.7979, en: 'MARUGAME' },
  { name: '坂出市',     lat: 34.3163, lng: 133.8603, en: 'SAKAIDE' },
  { name: '善通寺市',   lat: 34.2262, lng: 133.7942, en: 'ZENTSUJI' },
  { name: '観音寺市',   lat: 34.1275, lng: 133.6614, en: 'KANONJI' },
  { name: 'さぬき市',   lat: 34.3234, lng: 134.1730, en: 'SANUKI' },
  { name: '東かがわ市', lat: 34.2296, lng: 134.3376, en: 'HIGASHIKAGAWA' },
  { name: '三豊市',     lat: 34.1873, lng: 133.7150, en: 'MITOYO' },
  { name: '土庄町',     lat: 34.4869, lng: 134.1893, en: 'TONOSHO' },
  { name: '小豆島町',   lat: 34.4816, lng: 134.2847, en: 'SHODOSHIMA' },
  { name: '三木町',     lat: 34.2687, lng: 134.1140, en: 'MIKI' },
  { name: '直島町',     lat: 34.4600, lng: 133.9950, en: 'NAOSHIMA' },
  { name: '宇多津町',   lat: 34.3055, lng: 133.8236, en: 'UTAZU' },
  { name: '綾川町',     lat: 34.2308, lng: 133.9464, en: 'AYAGAWA' },
  { name: '琴平町',     lat: 34.1867, lng: 133.8158, en: 'KOTOHIRA' },
  { name: '多度津町',   lat: 34.2740, lng: 133.7565, en: 'TADOTSU' },
  { name: 'まんのう町', lat: 34.1608, lng: 133.8845, en: 'MANNO' }
];

// 市町を塗り分ける色。差し色の琥珀と馴染む暖色でまとめている。
const AREA_COLORS = [
  '#e8a33d', '#d98c53', '#c9a24a', '#e0b15c', '#cf8f3a',
  '#e6a95a', '#b98f5a', '#dca24d', '#c78a4a', '#f0b569',
  '#a98456', '#e2984a', '#d1a866', '#bb9358', '#eab273',
  '#c49b5f', '#dba54e'
];

// 一番近い役所の市町名を返す（境界データが無いときの保険）
function guessCity(lat, lng){
  let best = KAGAWA[0], bestDist = Infinity;
  for (const c of KAGAWA) {
    const dy = c.lat - lat;
    const dx = (c.lng - lng) * Math.cos(lat * Math.PI / 180);
    const d = dy * dy + dx * dx;
    if (d < bestDist) { bestDist = d; best = c; }
  }
  return best.name;
}

function cityOptions(selected){
  return KAGAWA
    .map(c => `<option value="${c.name}"${c.name === selected ? ' selected' : ''}>${c.name}</option>`)
    .join('');
}


/* =========================================================
   ② 地図をつくる
   ---------------------------------------------------------
   OpenFreeMap のベクタータイルを使う。APIキー・登録・回数制限なし。
   maxPitch:0 で「寝かせる（3D）」操作は禁止し、回転だけを許可する。
   ========================================================= */

const STYLES = {
  'Positron（淡いグレー）': 'https://tiles.openfreemap.org/styles/positron',
  'Bright（標準）':         'https://tiles.openfreemap.org/styles/bright',
  'Liberty（陰影つき）':    'https://tiles.openfreemap.org/styles/liberty'
};
const STYLE_NAMES = Object.keys(STYLES);
let styleName = STYLE_NAMES.includes(localStorage.getItem(STYLE_KEY))
              ? localStorage.getItem(STYLE_KEY) : STYLE_NAMES[0];

function hasWebGL(){
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext &&
             (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}

if (!hasWebGL() || typeof maplibregl === 'undefined') {
  document.getElementById('fallback').classList.add('show');
  throw new Error('WebGL unavailable');
}

const map = new maplibregl.Map({
  container: 'map',
  style: STYLES[styleName],
  center: [133.95, 34.22],
  zoom: 9,
  maxPitch: 0,                 // 傾け（3D表示）は使わない
  attributionControl: { compact: true }
});

map.addControl(new maplibregl.NavigationControl({ showCompass: true, visualizePitch: false }), 'bottom-right');
map.dragRotate.enable();
map.touchZoomRotate.enableRotation();


/* =========================================================
   ②-2 地名ラベルを消す
   ---------------------------------------------------------
   レイヤーIDの命名を推測すると外すので、IDは見ずに
   「文字を描くレイヤー（type が symbol）」を全部消す。
   ========================================================= */
function hideBaseLabels(){
  let style;
  try { style = map.getStyle(); } catch (e) { return; }   // 準備前なら何もしない
  if (!style || !style.layers) return;
  for (const l of style.layers) {
    if (l.type !== 'symbol') continue;
    if (l.id.startsWith('udon-')) continue;      // 自分で足したものは残す
    try { map.setLayoutProperty(l.id, 'visibility', 'none'); } catch (e) {}
  }
}


/* =========================================================
   ②-3 香川県の形にまつわる計算
   ========================================================= */

// 香川県の外を隠すための「大きな四角に穴を開けた図形」を作る
function maskGeoJSON(features){
  const OUTER = [[128, 30], [140, 30], [140, 40], [128, 40], [128, 30]];
  const holes = [];
  features.forEach(f => f.geometry.coordinates.forEach(poly => holes.push(poly[0])));
  return { type: 'Feature', properties: {},
           geometry: { type: 'Polygon', coordinates: [OUTER, ...holes] } };
}

// 全市町を囲む範囲（[[西,南],[東,北]]）
function boundsOf(features){
  let w = 180, s = 90, e = -180, n = -90;
  features.forEach(f => f.geometry.coordinates.forEach(poly => poly[0].forEach(p => {
    if (p[0] < w) w = p[0];
    if (p[0] > e) e = p[0];
    if (p[1] < s) s = p[1];
    if (p[1] > n) n = p[1];
  })));
  return [[w, s], [e, n]];
}

/* 点が多角形の中にあるかを調べる（レイキャスティング法）。
   その点から右へ半直線を伸ばし、辺と交差した回数が奇数なら内側。 */
function pointInRing(lat, lng, ring){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) &&
        (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function cityAt(lat, lng){
  for (const f of boundaries) {
    for (const poly of f.geometry.coordinates) {
      if (!pointInRing(lat, lng, poly[0])) continue;
      let inHole = false;
      for (let k = 1; k < poly.length; k++) if (pointInRing(lat, lng, poly[k])) inHole = true;
      if (!inHole) return f.properties.name;
    }
  }
  return guessCity(lat, lng);
}

/* 多角形の重心（面積で重み付け）。ラベルを図形の内側に置くために使う。 */
function ringCentroid(ring){
  let a = 0, x = 0, y = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
    a += f;
    x += (ring[j][0] + ring[i][0]) * f;
    y += (ring[j][1] + ring[i][1]) * f;
  }
  a *= 0.5;
  return a ? [x / (6 * a), y / (6 * a)] : null;   // [経度, 緯度]
}

// 離島を持つ市町は本土側に置きたいので、一番大きい塊の重心を採る
function featureCenter(f){
  let best = null, bestArea = 0;
  f.geometry.coordinates.forEach(poly => {
    const r = poly[0];
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of r) {
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    }
    const area = (maxX - minX) * (maxY - minY);
    if (area > bestArea) { bestArea = area; best = r; }
  });
  return best ? ringCentroid(best) : null;
}


/* =========================================================
   ②-4 画面の縦横比に合わせて地図の向きを決める
   ---------------------------------------------------------
   香川県は東西に長い。縦長の画面ではそのままだと上下が余るので、
   東西の軸が縦になるよう回して、画面を目いっぱい使う。
   ========================================================= */
function autoBearing(){
  // 初期状態は北を上（0度）に固定する。
  // 指2本でひねれば自由に回せるし、「向きを初期状態に戻す」でここに戻る。
  // 縦長画面で余白を詰めたくなったら、ここを 90 にすると東が上を向く。
  return 0;
}


/* =========================================================
   ③ 保存と読み込み（localStorage）
   ========================================================= */

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(shops)); }

function load(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) { try { shops = JSON.parse(saved); } catch (e) { shops = []; } }
  shops.forEach(s => { if (!s.city) s.city = guessCity(s.lat, s.lng); });
}


/* =========================================================
   ④ ピンを描く
   ========================================================= */

/* ---------------------------------------------------------
   うどん丼のピンを組み立てる。

   丼のルール（訪問回数 n を丼の種類と数で表す）
     金色の丼 = 10杯   銀色の丼 = 5杯   通常の丼 = 1杯
   例）15杯 = 金1 + 銀1 ／ 18杯 = 金1 + 銀1 + 通常3

   配置は、金・銀を左前、通常の丼を右後ろに積み上げる。
   --------------------------------------------------------- */

let pinSeq = 0;   // グラデーションのidが他のピンと衝突しないようにする連番

// 丼ひとつぶんの図形。type は normal / silver / gold / empty
function bowlSVG(x, y, s, type, uid){
  const fill   = type === 'gold'   ? `url(#gold${uid})`
               : type === 'silver' ? `url(#silv${uid})` : '#ffffff';
  const stroke = type === 'gold'   ? '#a8761a'
               : type === 'silver' ? '#7c828a' : '#98a0a8';

  // 通常の丼だけ、縁に青い線を入れる（見慣れたうどん丼の雰囲気）
  const band = (type === 'normal')
    ? '<path d="M-6.4,-1.5 C-5.3,0.7 -2.9,1.7 0,1.7 C2.9,1.7 5.3,0.7 6.4,-1.5" stroke="#5b8fc9" stroke-width="1.25" fill="none" stroke-linecap="round"/>'
    : '';

  // 金・銀にはつやを入れて、素材感を分ける
  const shine = (type === 'gold' || type === 'silver')
    ? '<path d="M-4.3,-1.9 C-3.9,-0.4 -2.5,0.7 -0.7,1" stroke="rgba(255,255,255,.8)" stroke-width="1.1" fill="none" stroke-linecap="round"/>'
    : '';

  const rimFill = (type === 'normal' || type === 'empty') ? '#f6f9fc' : 'rgba(255,255,255,.5)';

  return `<g transform="translate(${x},${y}) scale(${s})">
      <path d="M-7.3,-3.2 C-7.3,3.1 -4.1,6.3 0,6.3 C4.1,6.3 7.3,3.1 7.3,-3.2 Z"
            fill="${fill}" stroke="${stroke}" stroke-width="1.15" stroke-linejoin="round"/>
      ${band}${shine}
      <ellipse cx="0" cy="-3.2" rx="7.3" ry="2" fill="${rimFill}" stroke="${stroke}" stroke-width="1.15"/>
    </g>`;
}

// 金・銀の丼に添えるきらめき
function sparkleSVG(x, y){
  return `<g transform="translate(${x},${y})" stroke="#f0b046" stroke-width="1.3" stroke-linecap="round">
      <path d="M0,-4.2 V-1.8"/><path d="M-3.4,-2.6 L-1.9,-1.1"/><path d="M3.4,-2.6 L1.9,-1.1"/>
    </g>`;
}

function pinSVG(count, ghost){
  const uid = 'p' + (pinSeq++);

  // 何をいくつ描くかを決める
  let gold = 0, silver = 0, normal = 0, overflow = 0;
  if (!ghost && count > 0) {
    gold   = Math.floor(count / 10);
    silver = Math.floor((count % 10) / 5);
    normal = count % 5;
    if (gold > 2) { overflow = count; gold = 1; silver = 0; normal = 0; }  // 多すぎるときは数字で
  }

  let inner = '';

  if (ghost) {
    inner = bowlSVG(21, 25, 1, 'empty', uid);

  } else if (overflow) {
    inner = bowlSVG(21, 20, 0.85, 'gold', uid) + sparkleSVG(21, 12) +
      `<text x="21" y="33" text-anchor="middle" font-size="11" font-weight="700"
             fill="#7d5610" font-family="sans-serif">${overflow}</text>`;

  } else {
    // 金・銀は下から順に積む（金が下、銀が上）
    const miles = [];
    for (let i = 0; i < gold; i++)   miles.push('gold');
    for (let i = 0; i < silver; i++) miles.push('silver');

    const hasMile = miles.length > 0;
    const hasNormal = normal > 0;

    // 通常の丼は右後ろ。金・銀があるときは小さくして右へ寄せる
    const nx = hasMile ? 26.5 : 21;
    const ny = hasMile ? 24 : 27;
    const ns = hasMile ? 0.56 : 0.82;
    const nStep = hasMile ? 4.0 : 4.8;
    for (let i = 0; i < normal; i++) inner += bowlSVG(nx, ny - i * nStep, ns, 'normal', uid);

    // 金・銀は左前。通常の丼が無いときは中央に置く
    const mx = hasNormal ? 15 : 21;
    let my = 27;
    miles.forEach((t, i) => {
      inner += bowlSVG(mx, my - i * 7.6, 0.98, t, uid);
    });
    if (hasMile) inner += sparkleSVG(mx, my - (miles.length - 1) * 7.6 - 8);
  }

  return `<svg class="pin" viewBox="0 0 42 54" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gold${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f8cf74"/><stop offset="1" stop-color="#d79820"/>
      </linearGradient>
      <linearGradient id="silv${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#edf0f3"/><stop offset="1" stop-color="#b4bcc4"/>
      </linearGradient>
    </defs>
    <path d="M21,52.5 C21,52.5 4.5,29.5 4.5,20 A16.5,16.5 0 1,1 37.5,20 C37.5,29.5 21,52.5 21,52.5 Z"
          fill="#ffffff" stroke="#e8912f" stroke-width="2.6" stroke-linejoin="round"/>
    ${inner}
  </svg>`;
}

function pinElement(count, ghost){
  const el = document.createElement('div');
  el.className = 'pin-wrap' + (ghost ? ' ghost' : '');
  el.innerHTML = pinSVG(count, ghost);
  return el;
}

function makePopupHTML(shop){
  const count = shop.visits.length;
  const last = count > 0 ? `　最終訪問 ${shop.visits[count - 1]}` : '';
  return `
    <div class="popup-name">${escapeHtml(shop.name)}</div>
    <div class="popup-count"><b>${count}</b> 回訪問${last}${
      shop.addr ? '<br>' + escapeHtml(shop.addr) : ''}</div>
    <div class="popup-city">エリア
      <select onchange="setCity('${shop.id}', this.value)">${cityOptions(shop.city)}</select>
    </div>
    <div class="popup-actions">
      <button onclick="addVisit('${shop.id}')">訪問を記録</button>
      <button class="link-danger" onclick="removeShop('${shop.id}')">削除</button>
    </div>${shop.approx ? '<div class="popup-note">位置は住所からの概算です。ドラッグで調整できます</div>' : ''}
  `;
}

function drawShop(shop){
  const marker = new maplibregl.Marker({
    element: pinElement(shop.visits.length),
    anchor: 'bottom',                     // 丼ピンの先端が座標を指すようにする
    draggable: true                       // GPSや概算のずれを手で直せるようにする
  })
    .setLngLat([shop.lng, shop.lat])
    .setPopup(new maplibregl.Popup({ closeButton: false, className: 'u-popup', maxWidth: '270px' })
                .setHTML(makePopupHTML(shop)))
    .addTo(map);

  marker.on('dragend', () => {
    const p = marker.getLngLat();
    shop.lat = p.lat;
    shop.lng = p.lng;
    save();
  });

  markers[shop.id] = marker;
}

function clearMarkers(){
  for (const id in markers) markers[id].remove();
  markers = {};
}

function redraw(){
  clearMarkers();
  refreshAreaOptions();
  visibleShops().forEach(drawShop);
  updateStats();
}

function visibleShops(){
  const area = areaSelect.value;
  return area === 'all' ? shops : shops.filter(s => s.city === area);
}

function refreshAreaOptions(){
  const current = areaSelect.value || 'all';
  areaSelect.innerHTML =
    `<option value="all">香川県全体（${shops.length}軒）</option>` +
    KAGAWA.map(c => {
      const n = shops.filter(s => s.city === c.name).length;
      return `<option value="${c.name}">${c.name}（${n}軒）</option>`;
    }).join('');
  areaSelect.value = current;
}

function updateStats(){
  const list = visibleShops();
  document.getElementById('stat-shops').textContent = list.length;
  document.getElementById('stat-visited').textContent = list.filter(s => s.visits.length > 0).length;
  document.getElementById('stat-total').textContent = list.reduce((n, s) => n + s.visits.length, 0);
}


/* =========================================================
   ⑤ 地図に市町の色分け・マスク・強調を追加する
   ---------------------------------------------------------
   MapLibre では「データ（source）」と「描き方（layer）」を分けて登録する。
   スタイルを切り替えると全部消えるので、まとめてやり直せるようにしてある。
   ========================================================= */

/* 地図の準備が整うタイミングは環境によってばらつくので、
   「まだなら何もせず、次の機会に再挑戦する」形にしておく。
   load / styledata / idle の3つから繰り返し呼ぶので、
   どこかのタイミングで必ず設置される。 */
function ensureLayers(){
  if (!boundaries.length) return;          // データがまだ
  if (map.getLayer('udon-outside')) return; // すでに設置済み
  try {
    installLayers();
  } catch (e) {
    // 地図側の準備がまだ。次の呼び出しに任せる
  }
}

function installLayers(){
  if (!boundaries.length) return;

  hideBaseLabels();

  // --- データを登録 ---
  if (!map.getSource('udon-kagawa')) {
    map.addSource('udon-kagawa', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: boundaries },
      promoteId: 'name'                  // マウスを乗せた市町を識別するため
    });
  }
  if (!map.getSource('udon-mask')) {
    map.addSource('udon-mask', { type: 'geojson', data: maskGeoJSON(boundaries) });
  }
  if (!map.getSource('udon-dim')) {
    map.addSource('udon-dim', { type: 'geojson', data: maskGeoJSON(boundaries) });
  }

  // 市町名 → 色 の対応表を式として組み立てる
  const colorExpr = ['match', ['get', 'name']];
  KAGAWA.forEach((c, i) => colorExpr.push(c.name, AREA_COLORS[i % AREA_COLORS.length]));
  colorExpr.push('#cccccc');

  // --- 描き方を登録（下から順に）---
  if (!map.getLayer('udon-outside')) {
    map.addLayer({                        // ① 県外を完全に隠す
      id: 'udon-outside', type: 'fill', source: 'udon-mask',
      paint: { 'fill-color': '#e7e7e4', 'fill-opacity': 1 }
    });
  }
  if (!map.getLayer('udon-city-fill')) {
    map.addLayer({                        // ② 市町の色分け
      id: 'udon-city-fill', type: 'fill', source: 'udon-kagawa',
      paint: {
        'fill-color': colorExpr,
        'fill-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.34, 0.17]
      }
    });
  }
  if (!map.getLayer('udon-city-line')) {
    map.addLayer({                        // ③ 市町の境界線
      id: 'udon-city-line', type: 'line', source: 'udon-kagawa',
      paint: { 'line-color': colorExpr, 'line-width': 1.4, 'line-opacity': 0.9 }
    });
  }
  if (!map.getLayer('udon-dim')) {
    map.addLayer({                        // ④ 選択中の市町以外を暗くする
      id: 'udon-dim', type: 'fill', source: 'udon-dim',
      layout: { visibility: 'none' },
      paint: { 'fill-color': '#0e1319', 'fill-opacity': 0.42 }
    });
  }
  if (!map.getLayer('udon-sel-line')) {
    map.addLayer({                        // ⑤ 選択中の市町の縁取り
      id: 'udon-sel-line', type: 'line', source: 'udon-kagawa',
      filter: ['==', ['get', 'name'], ''],
      paint: { 'line-color': '#e8a33d', 'line-width': 3 }
    });
  }

  styleReady = true;
  applyArea();
}

// 市町の上にマウスを乗せたときの反応
let hovered = null;
map.on('mousemove', 'udon-city-fill', (e) => {
  if (areaSelect.value !== 'all') return;
  map.getCanvas().style.cursor = 'pointer';
  if (hovered) map.setFeatureState({ source: 'udon-kagawa', id: hovered }, { hover: false });
  hovered = e.features[0].id;
  map.setFeatureState({ source: 'udon-kagawa', id: hovered }, { hover: true });
});
map.on('mouseleave', 'udon-city-fill', () => {
  map.getCanvas().style.cursor = '';
  if (hovered) map.setFeatureState({ source: 'udon-kagawa', id: hovered }, { hover: false });
  hovered = null;
});

// 市町をクリック＝エリア選択で選んだのと同じ扱い
map.on('click', 'udon-city-fill', (e) => {
  if (addingMode || areaSelect.value !== 'all') return;
  areaSelect.value = e.features[0].properties.name;
  areaSelect.dispatchEvent(new Event('change'));
});

// 選択中に、暗くなっている外側をクリックすると選択解除
map.on('click', 'udon-dim', (e) => {
  if (addingMode || areaSelect.value === 'all') return;
  areaSelect.value = 'all';
  areaSelect.dispatchEvent(new Event('change'));
});


/* 選択中のエリアに合わせて、表示と地図の位置を切り替える */
function applyArea(){
  if (!styleReady) return;
  const area = areaSelect.value;

  labelMarkers.forEach(m => m.remove());
  labelMarkers = [];

  // 余白に出す大きなエリア名
  const at = document.getElementById('area-title');
  if (area === 'all') {
    at.classList.remove('show');
  } else {
    const info = KAGAWA.find(c => c.name === area);
    document.getElementById('at-ja').textContent = area;
    document.getElementById('at-en').textContent = info ? info.en : '';
    at.classList.add('show');
  }

  if (area === 'all') {
    map.setLayoutProperty('udon-city-fill', 'visibility', 'visible');
    map.setLayoutProperty('udon-city-line', 'visibility', 'visible');
    map.setLayoutProperty('udon-dim', 'visibility', 'none');
    map.setFilter('udon-sel-line', ['==', ['get', 'name'], '']);

    // 市町名のラベルを置く（クリックは下の図形に通す）
    boundaries.forEach(f => {
      const c = featureCenter(f);
      if (!c) return;
      const el = document.createElement('div');
      el.className = 'area-name';
      el.textContent = f.properties.name;
      labelMarkers.push(new maplibregl.Marker({ element: el }).setLngLat(c).addTo(map));
    });

    map.fitBounds(boundsOf(boundaries), { padding: 14, bearing: autoBearing(), duration: 600 });
    return;
  }

  const f = boundaries.find(b => b.properties.name === area);
  if (!f) return;

  // 選んだ市町だけを穴にした覆いを作り直して、外側を暗くする
  map.getSource('udon-dim').setData(maskGeoJSON([f]));
  map.setLayoutProperty('udon-dim', 'visibility', 'visible');
  map.setLayoutProperty('udon-city-fill', 'visibility', 'none');
  map.setLayoutProperty('udon-city-line', 'visibility', 'none');
  map.setFilter('udon-sel-line', ['==', ['get', 'name'], area]);

  map.fitBounds(boundsOf([f]), { padding: 40, bearing: autoBearing(), duration: 600 });
}


/* =========================================================
   ⑥ 起動処理
   ========================================================= */

map.on('load', () => {
  hideBaseLabels();

  Promise.all([
    fetch('kagawa.geojson').then(r => r.json()).catch(() => null),
    fetch('shops.json').then(r => r.json()).catch(() => null)
  ]).then(([geo, cat]) => {
    if (cat) catalog = cat;
    if (!geo) { console.warn('kagawa.geojson を読み込めませんでした'); return; }

    boundaries = geo.features;

    // 境界が読めたので、エリアを正確な判定に置き換える。
    // ただし手で直したもの（cityFixed）は尊重する。
    let changed = false;
    shops.forEach(s => {
      if (s.cityFixed) return;
      const c = cityAt(s.lat, s.lng);
      if (c !== s.city) { s.city = c; changed = true; }
    });
    if (changed) save();

    // 香川県の外へ出られないようにする
    const b = boundsOf(boundaries);
    // 回転時は画面の四隅が県境の外にはみ出すので、制限は余裕を持たせる。
    // 県外そのものはマスク（udon-outside）で隠しているため、これで十分。
    map.setMaxBounds([[b[0][0] - 0.5, b[0][1] - 0.4], [b[1][0] + 0.5, b[1][1] + 0.4]]);

    ensureLayers();
    redraw();
  });
});

// 地図の準備が整うたびに設置を試みる。
// styledata はスタイル切り替え時にも飛ぶので、切り替え後の入れ直しも兼ねる。
map.on('styledata', () => { hideBaseLabels(); ensureLayers(); });
map.on('idle',      () => { hideBaseLabels(); ensureLayers(); });

// 画面を回したときなど、縦横比が変わったら向きを取り直す
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (styleReady) applyArea(); }, 300);
});


/* =========================================================
   ⑦ エリア選択
   ========================================================= */

const areaSelect = document.getElementById('area');

areaSelect.addEventListener('change', () => {
  redraw();
  applyArea();
  if (sheet.classList.contains('open')) renderSheet();
});


/* =========================================================
   ⑧ 店を登録する（地図から／右クリック／現在地）
   ========================================================= */

const btnAdd = document.getElementById('btn-add');
const hint = document.getElementById('hint');

btnAdd.addEventListener('click', () => {
  addingMode = !addingMode;
  btnAdd.classList.toggle('active', addingMode);
  btnAdd.textContent = addingMode ? '追加をやめる' : '地図から追加';
  document.getElementById('map').classList.toggle('adding', addingMode);
  hint.textContent = addingMode
    ? '地図上で、店のある場所をクリックしてください'
    : '地図を右クリックしても登録できます';
});

// 左クリック（追加モード中のみ）
map.on('click', (e) => {
  if (!addingMode) return;
  addShopAt(e.lngLat.lat, e.lngLat.lng);
  btnAdd.click();
});

// 右クリックはいつでも
map.on('contextmenu', (e) => {
  addShopAt(e.lngLat.lat, e.lngLat.lng);
});

let serial = 0;

/* 指定した座標に、店名を入力するポップアップを開く。
   地図クリック・右クリック・現在地の3か所から呼ばれる共通の処理。 */
function addShopAt(lat, lng, title){
  if (ghostMarker) ghostMarker.remove();

  // 登録予定の位置に、うすい仮のピンを置く
  ghostMarker = new maplibregl.Marker({ element: pinElement(0, true), anchor: 'bottom' })
    .setLngLat([lng, lat]).addTo(map);

  const popup = new maplibregl.Popup({ closeButton: false, className: 'u-popup', maxWidth: '270px' })
    .setLngLat([lng, lat])
    .setHTML(`
      <div class="popup-name">${title || 'この場所に登録'}</div>
      <input type="text" class="popup-input" id="new-name" placeholder="店名" autocomplete="off">
      <div class="popup-city">エリア
        <select id="new-city">${cityOptions(cityAt(lat, lng))}</select>
      </div>
      <div class="popup-actions">
        <button id="new-save">登録する</button>
        <button id="new-cancel" class="link-danger">やめる</button>
      </div>
      <div class="popup-note">エリアは位置から自動判定しています。違っていれば選び直してください</div>
    `)
    .addTo(map);

  // どんな閉じ方をしても、仮のピンは必ず片づける
  popup.on('close', () => {
    if (ghostMarker) { ghostMarker.remove(); ghostMarker = null; }
  });

  const input = document.getElementById('new-name');
  if (!isTouch) input.focus();

  function commit(){
    const name = input.value.trim();
    if (!name) { input.focus(); return; }

    const id = 's' + Date.now() + '_' + (serial++);
    shops.push({
      id, name, lat, lng,
      city: document.getElementById('new-city').value,
      visits: [today()]
    });

    save();
    popup.remove();
    redraw();
    if (markers[id]) markers[id].togglePopup();

    showUndo(name, () => {
      shops = shops.filter(s => s.id !== id);
      save();
      redraw();
    });
  }

  document.getElementById('new-save').addEventListener('click', commit);
  document.getElementById('new-cancel').addEventListener('click', () => popup.remove());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') popup.remove();
  });
}


/* ---------- 現在地から追加 ---------- */

const btnHere = document.getElementById('btn-here');

btnHere.addEventListener('click', () => {
  if (!navigator.geolocation) { alert('このブラウザは位置情報に対応していません。'); return; }
  btnHere.disabled = true;
  btnHere.innerHTML = '<span class="dot"></span>現在地を取得中…';
  navigator.geolocation.getCurrentPosition(onLocationOk, onLocationNg, {
    enableHighAccuracy: true,   // GPSを優先して精度を上げる
    timeout: 15000,
    maximumAge: 0
  });
});

function resetHereButton(){
  btnHere.disabled = false;
  btnHere.innerHTML = '<span class="dot"></span>現在地から追加';
}

function onLocationOk(pos){
  resetHereButton();
  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  const acc = Math.round(pos.coords.accuracy);

  if (meMarker) meMarker.remove();
  const el = document.createElement('div');
  el.className = 'me';
  meMarker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);

  map.easeTo({ center: [lng, lat], zoom: 16, duration: 600 });
  addShopAt(lat, lng, `現在地に登録（誤差 約${acc}m）`);
}

function onLocationNg(err){
  resetHereButton();
  if (err.code === 1)      alert('位置情報の利用が許可されていません。\nアドレスバー左のアイコンから許可してください。');
  else if (err.code === 2) alert('位置情報を取得できませんでした。\n端末の位置情報がオンになっているか確認してください。');
  else                     alert('位置情報の取得に時間がかかりすぎました。\n屋外でもう一度お試しください。');
}


/* =========================================================
   ⑨ 一覧から選ぶ
   ========================================================= */

const sheet   = document.getElementById('sheet');
const sheetQ  = document.getElementById('sheet-q');
const sheetLs = document.getElementById('sheet-list');
const sheetArea = document.getElementById('sheet-area');

// スマホで自動フォーカスするとキーボードが一覧を隠すので、PCのときだけ
const isTouch = matchMedia('(pointer: coarse)').matches;

document.getElementById('btn-list').addEventListener('click', () => {
  sheet.classList.toggle('open');
  if (sheet.classList.contains('open')) {
    renderSheet();
    if (!isTouch) sheetQ.focus();
  }
});
document.getElementById('sheet-close').addEventListener('click', () => sheet.classList.remove('open'));
sheetQ.addEventListener('input', renderSheet);

function findRegistered(item){
  return shops.find(s => s.name === item.name && Math.abs(s.lat - item.lat) < 1e-5);
}

function renderSheet(){
  const kw = sheetQ.value.trim();
  const area = areaSelect.value;

  // 一覧側のエリア選択を、上部の選択と揃えておく
  refreshSheetAreaOptions();
  sheetArea.value = area;

  let list = catalog.filter(s => area === 'all' || s.city === area);
  if (kw) list = list.filter(s => s.name.includes(kw) || (s.addr || '').includes(kw));

  const done = list.filter(findRegistered).length;
  document.getElementById('sheet-meta').innerHTML = `<b>${done}</b> / ${list.length} 軒`;

  if (!list.length) {
    sheetLs.innerHTML = '<div class="sheet-none">該当する店がありません。<br>「地図から追加」で手動登録できます。</div>';
    return;
  }

  sheetLs.innerHTML = list.map(s => {
    const reg = findRegistered(s);
    const n = reg ? reg.visits.length : 0;
    const i = catalog.indexOf(s);
    return `<div class="row ${n ? '' : 'new'}" data-i="${i}">
        <div class="row-body">
          <div class="row-name">${escapeHtml(s.name)}</div>
          <div class="row-addr">${escapeHtml(s.addr || '')}</div>
        </div>
        <div class="row-ctrl">
          ${n ? `<button class="row-btn minus" data-act="minus" data-i="${i}" aria-label="1回減らす">−</button>` : ''}
          <div class="row-badge">${n || '+'}</div>
          ${n ? `<button class="row-btn plus" data-act="plus" data-i="${i}" aria-label="1回増やす">＋</button>` : ''}
        </div>
      </div>`;
  }).join('');
}

// 一覧パネルのエリア選択の中身を作る
function refreshSheetAreaOptions(){
  const cur = sheetArea.value;
  sheetArea.innerHTML =
    `<option value="all">香川県全体</option>` +
    KAGAWA.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
  if (cur) sheetArea.value = cur;
}

// 一覧側でエリアを変えたら、上部の選択にも反映する（地図も連動して動く）
sheetArea.addEventListener('change', () => {
  areaSelect.value = sheetArea.value;
  areaSelect.dispatchEvent(new Event('change'));
});

/* 訪問回数を1回減らす。0になったら記録ごと消す。 */
function decrementVisit(item){
  const shop = findRegistered(item);
  if (!shop) return;

  const before = shop.visits.slice();          // 取り消し用に控えておく

  shop.visits.pop();
  if (shop.visits.length === 0) shops = shops.filter(s => s.id !== shop.id);

  save();
  redraw();
  renderSheet();

  showUndo(item.name, () => {
    const still = shops.find(s => s.id === shop.id);
    if (still) still.visits = before;          // 減らしただけなら戻す
    else { shop.visits = before; shops.push(shop); }   // 消えていたら復活させる
    save();
    redraw();
    renderSheet();
  }, 'の記録を1回減らしました');
}

sheetLs.addEventListener('click', (e) => {
  const btn = e.target.closest('.row-btn');
  if (btn) {                                   // ＋ / − ボタンが押された
    const item = catalog[Number(btn.dataset.i)];
    if (btn.dataset.act === 'minus') decrementVisit(item);
    else                            pickFromCatalog(item);
    return;
  }
  const row = e.target.closest('.row');        // 行そのものが押された＝1回増やす
  if (row) pickFromCatalog(catalog[Number(row.dataset.i)]);
});

function pickFromCatalog(item){
  let shop = findRegistered(item);
  let undo;

  if (shop) {
    shop.visits.push(today());
    const s = shop;
    undo = () => { s.visits.pop(); save(); redraw(); renderSheet(); };
  } else {
    shop = {
      id: 's' + Date.now() + '_' + (serial++),
      name: item.name, lat: item.lat, lng: item.lng,
      city: item.city || cityAt(item.lat, item.lng),
      addr: item.addr,
      approx: item.approx || 0,
      visits: [today()]
    };
    shops.push(shop);
    const id = shop.id;
    undo = () => { shops = shops.filter(s => s.id !== id); save(); redraw(); renderSheet(); };
  }

  save();
  redraw();
  renderSheet();
  map.easeTo({ center: [item.lng, item.lat], zoom: 15, duration: 600 });
  if (markers[shop.id]) markers[shop.id].togglePopup();
  showUndo(item.name, undo);
}


/* =========================================================
   ⑩ 登録直後の「取り消す」トースト
   ========================================================= */

const toast = document.getElementById('toast');
const toastName = document.getElementById('toast-name');
const toastSuffix = document.getElementById('toast-suffix');
let toastTimer = null, lastAction = null;

function showUndo(name, undoFn, suffix){
  lastAction = undoFn;
  toastName.textContent = name;
  toastSuffix.textContent = suffix || 'を登録しました';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 6000);
}

document.getElementById('toast-undo').addEventListener('click', () => {
  if (lastAction) lastAction();
  toast.classList.remove('show');
  clearTimeout(toastTimer);
});


/* =========================================================
   ⑪ ピンのポップアップから呼ばれる操作
   ========================================================= */

window.addVisit = function(id){
  const shop = shops.find(s => s.id === id);
  if (!shop) return;
  shop.visits.push(today());
  save();
  redraw();
  if (markers[id]) markers[id].togglePopup();
  showUndo(shop.name, () => {
    shop.visits.pop(); save(); redraw();
    if (markers[id]) markers[id].togglePopup();
  });
};

window.setCity = function(id, city){
  const shop = shops.find(s => s.id === id);
  if (!shop) return;
  shop.city = city;
  shop.cityFixed = true;      // 手で直した印。以後、自動判定で上書きしない
  save();
  redraw();
};

window.removeShop = function(id){
  const shop = shops.find(s => s.id === id);
  if (!shop) return;
  if (!confirm(`「${shop.name}」の記録を削除します。よろしいですか？`)) return;
  shops = shops.filter(s => s.id !== id);
  save();
  redraw();
};


/* =========================================================
   ⑫ 書き出し・読み込み・メニュー
   ========================================================= */

document.getElementById('btn-export').addEventListener('click', () => {
  if (!shops.length) { alert('書き出すデータがまだありません'); return; }
  const blob = new Blob([JSON.stringify(shops, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `udonmap_${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

const fileInput = document.getElementById('file-input');
document.getElementById('btn-import').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error();
      if (!confirm('今の記録を、読み込んだファイルの内容で置き換えます。よろしいですか？')) return;
      shops = data;
      save();
      redraw();
    } catch (err) {
      alert('読み込めませんでした。このアプリで書き出したJSONファイルを選んでください。');
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
});

// 地図のスタイルを順番に切り替える
document.getElementById('btn-style').addEventListener('click', () => {
  const i = (STYLE_NAMES.indexOf(styleName) + 1) % STYLE_NAMES.length;
  styleName = STYLE_NAMES[i];
  localStorage.setItem(STYLE_KEY, styleName);
  styleReady = false;
  map.setStyle(STYLES[styleName]);
  // 入れ直しは styledata / idle から呼ばれる ensureLayers に任せる
  map.once('idle', redraw);
});

// 向きを初期状態（画面に合わせた角度）に戻す
document.getElementById('btn-north').addEventListener('click', () => {
  map.easeTo({ bearing: autoBearing(), duration: 500 });
});

const menu = document.getElementById('menu');
document.getElementById('btn-menu').addEventListener('click', (e) => {
  e.stopPropagation();
  menu.classList.toggle('open');
});
document.addEventListener('click', () => menu.classList.remove('open'));
menu.addEventListener('click', (e) => e.stopPropagation());


/* =========================================================
   ⑬ 小さな道具
   ========================================================= */

function today(){
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}


/* =========================================================
   ⑭ 起動
   ========================================================= */
load();
refreshAreaOptions();
updateStats();
</script>
